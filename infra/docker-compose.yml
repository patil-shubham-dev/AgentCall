version: '3.8'

services:
  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ac-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file: ../.env
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    container_name: ac-mcp
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: ../.env
    depends_on:
      - backend-api

  caddy:
    image: caddy:2-alpine
    container_name: ac-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-api
      - mcp-server

volumes:
  caddy_data:
  caddy_config:
