services:
  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ac-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file: ../backend/.env
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.8-alpine
    container_name: ac-caddy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_add:
      - NET_BIND_SERVICE

  coturn:
    image: coturn/coturn:4.6.2
    container_name: ac-coturn
    restart: unless-stopped
    env_file: ../backend/.env
    entrypoint: ['/entrypoint.sh']
    volumes:
      - ./coturn/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '5349:5349/tcp'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:
