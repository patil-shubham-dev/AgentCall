apiVersion: v1
kind: ConfigMap
metadata:
  name: voicebridge-config
  namespace: voicebridge
data:
  NODE_ENV: "production"
  PORT: "4000"
  PERSISTENCE_MODE: "database"
  CORS_ALLOWED_ORIGINS: "https://your-domain.com"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_POOL_IDLE_TIMEOUT: "30000"
  DB_VERIFICATION_INTERVAL_MS: "0"
  BODY_LIMIT_BYTES: "1048576"
