apiVersion: v1
kind: Service
metadata:
  name: voicebridge-backend
  namespace: voicebridge
  labels:
    app: voicebridge
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: voicebridge
    component: backend
