services:
  - type: web
    name: agentcall-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PERSISTENCE_MODE
        value: database
      # Explicit allowlist — never default to *. The MCP web clients
      # (ChatGPT/Claude) are allowed by the backend unconditionally.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
