services:
  - type: web
    name: agentcall-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PERSISTENCE_MODE
        value: database
