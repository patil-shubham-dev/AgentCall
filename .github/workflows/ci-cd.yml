name: VoiceBridge CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mcp-server/**'
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mcp-server/**'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/voicebridge-backend
  MCP_IMAGE: ghcr.io/${{ github.repository }}/mcp-server

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:load

  security-scan:
    name: Security Audit & Dependency Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/sbom.json

  build:
    name: Build & Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to staging
        run: |
          kubectl set image deployment/voicebridge-backend -n voicebridge \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --record
          kubectl rollout status deployment/voicebridge-backend -n voicebridge --timeout=120s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Manual approval gate
        run: echo "Production deployment approved"
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production
        run: |
          kubectl set image deployment/voicebridge-backend -n voicebridge \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --record
          kubectl rollout status deployment/voicebridge-backend -n voicebridge --timeout=120s
      - name: Health check
        run: |
          sleep 10
          kubectl run health-check --image=curlimages/curl --restart=Never -- \
            -s -o /dev/null -w "%{http_code}" http://voicebridge-backend:4000/api/v1/health
          kubectl delete pod health-check
