name: VoiceBridge CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [develop, staging, main]
    paths:
      - 'backend/**'
      - 'infra/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          SERVICE_TOKEN: test

  security-scan:
    name: Security Audit & Dependency Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: backend/sbom.json

  build:
    name: Build & Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY@L}/voicebridge-backend" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY@L}/voicebridge-backend" >> $GITHUB_ENV
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Validate kubeconfig
        run: |
          if [ ! -s "$HOME/.kube/config" ]; then
            echo "::error::KUBECONFIG_STAGING secret is empty or not set. Configure it in GitHub repository secrets."
            exit 1
          fi
          if ! kubectl version --client > /dev/null 2>&1; then
            echo "::error::kubectl is not installed or not available in PATH."
            exit 1
          fi
      - name: Check cluster connectivity
        run: |
          if ! kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
            echo "::error::Cannot connect to staging cluster. Check that the cluster is running and KUBECONFIG_STAGING is valid."
            exit 1
          fi
      - name: Deploy to staging
        run: |
          kubectl set image deployment/voicebridge-backend -n voicebridge \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --record
          kubectl rollout status deployment/voicebridge-backend -n voicebridge --timeout=120s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Manual approval gate
        run: echo "Production deployment approved"
      - uses: actions/checkout@v4
      - name: Set lowercase image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY@L}/voicebridge-backend" >> $GITHUB_ENV
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
      - name: Validate kubeconfig
        run: |
          if [ ! -s "$HOME/.kube/config" ]; then
            echo "::error::KUBECONFIG_PRODUCTION secret is empty or not set. Configure it in GitHub repository secrets."
            exit 1
          fi
          if ! kubectl version --client > /dev/null 2>&1; then
            echo "::error::kubectl is not installed or not available in PATH."
            exit 1
          fi
      - name: Check cluster connectivity
        run: |
          if ! kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
            echo "::error::Cannot connect to production cluster. Check that the cluster is running and KUBECONFIG_PRODUCTION is valid."
            exit 1
          fi
      - name: Deploy to production
        run: |
          kubectl set image deployment/voicebridge-backend -n voicebridge \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --record
          kubectl rollout status deployment/voicebridge-backend -n voicebridge --timeout=120s
      - name: Health check
        run: |
          sleep 10
          kubectl run health-check --image=curlimages/curl --restart=Never -- \
            -s -o /dev/null -w "%{http_code}" http://voicebridge-backend:4000/api/v1/health
          kubectl delete pod health-check
