# Prevent Render free-tier idle spin-down for AgentCall backend.
# Render spins down free web services after ~15 minutes without inbound
# HTTP/WebSocket traffic (https://docs.render.com/free#spinning-down-on-idle).
# A spun-down service takes ~20-30s to cold-start on next request, which
# surfaces as call-setup latency and partial WS connection failures on the
# Android app.
#
# SCHEDULE REALITY CHECK (2026-10-31):
# GitHub's `schedule` trigger is delivery-lagged, not hard-realtime. With a
# `*/5` cron the observed actual cadence was one run every ~4-6 HOURS — the
# scheduler intentionally delays runs under load and has no minimum-freshness
# guarantee. Burst-mode fixes the gap: each run holds the instance warm for
# ~9 minutes by pinging every 60s, so a scheduled run (whenever it actually
# fires) re-warms a spun-down instance and the phone's own 15-min WorkManager
# heartbeat (mobile/android app/warmup/WarmupPingWorker) covers the gaps.
#
# Cost: free tier. Render allows 750 instance-hours/month (~31 days) — this
# backend alone at always-on consumes ~731h, so budget is exhausted only if a
# second free service is added on the same account.
#
# Endpoint: GET /health is the lightweight no-auth, no-DB handler
# (backend/src/routes.ts). Migrating to a paid Render plan (which never spins
# down) disables the need for both this file and the app heartbeat. See the
# DEPLOYMENT_GUIDE section "Keeping the free tier warm".
#
# Stagger: two schedule entries ~30 min apart reduce the worst-case gap when
# the scheduler delays one run; they collapse into the same work when both
# fire close together (jobs do not queue against each other for schedule
# events, each fires as its own run).

name: Keep Render Warm

on:
  schedule:
    - cron: '*/10 * * * *'      # burst every 10 min (max 9 min hold)
    - cron: '33 * * * *'        # second anchor close to the hour to trim gap when the first is late
  workflow_dispatch:            # allow manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Keep-warm burst (60s x 9)
        env:
          URL: https://agentcall-66ke.onrender.com/health
        run: |
          set -u
          normalize() { curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 45 "$1" 2>/dev/null || echo "000"; }
          # First hit spins up a cold instance — give it up to 45s and retry
          # twice before reporting the instance as unreachable (a cold start
          # that ends 200 confirms the wake worked).
          code=$(normalize "$URL")
          attempt=1
          while [ "$code" != "200" ] && [ "$attempt" -le 2 ]; do
            echo "Attempt $attempt -> HTTP $code; retrying after spin-up window"
            sleep 20
            code=$(normalize "$URL")
            attempt=$((attempt+1))
          done
          echo "Initial ping $URL -> HTTP $code"
          echo "Body: $(cat /tmp/body.txt 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::warning::Health endpoint returned non-200 ($code) after spin-up retries — investigate Render auto-deploys or backend health"
          fi
          # Hold window: while the scheduler has been late keeping runs
          # together, this loop keeps traffic fresh for ~9 minutes so the
          # next scheduled run (or the phone heartbeat) lands on a warm host.
          for i in $(seq 1 9); do
            sleep 58
            code=$(normalize "$URL")
            echo "[$i/9] $URL -> HTTP $code at $(date -u +%H:%M:%SZ)"
          done
