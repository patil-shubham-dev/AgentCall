name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            mcp-server/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      - name: Lint backend
        working-directory: backend
        run: npx eslint src/ --ext .ts || echo "Lint warnings"
      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci
      - name: Typecheck mcp-server
        working-directory: mcp-server
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npx vitest run --coverage
        env:
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: test
          SERVICE_TOKEN: test
          COTURN_SECRET: test

  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        working-directory: backend
        run: docker build -t ic-backend .
      - name: Build mcp-server image
        working-directory: mcp-server
        run: docker build -t ic-mcp .
