name: Bug Report
description: Report a bug to help us improve AgentCall
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start backend with 'npm run dev'
        2. Connect Android app to localhost:4000
        3. Initiate a call via MCP tool 'create_call'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: backend-version
    attributes:
      label: Backend Version
      description: What version of the backend are you running?
      placeholder: v1.0.0 or commit SHA

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running AgentCall?
      options:
        - Development (localhost)
        - Docker Compose
        - Kubernetes
        - Production

  - type: input
    id: device
    attributes:
      label: Device
      description: Device and OS version
      placeholder: Pixel 9, Android 16

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs or error messages
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
